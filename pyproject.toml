[project]
name = "quercus-bot"
version = "0.1.0"
description = "Autonomous U of T Quercus (Canvas LMS) Telegram Alert Bot"
readme = "README.md"
authors = [
    { name = "Jinwoo Lee", email = "lee04jinwoo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
]

[project.scripts]
quercus-bot = "quercus_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
