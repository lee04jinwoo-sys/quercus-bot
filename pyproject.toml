[project]
name = "quercus-bot"
version = "0.1.0"
description = "Autonomous U of T Quercus (Canvas LMS) Telegram Alert Bot"
readme = "README.md"
authors = [
    { name = "Jinwoo Lee", email = "lee04jinwoo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.scripts]
quercus-bot = "quercus_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
